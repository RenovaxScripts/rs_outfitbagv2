<!doctype html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
    <title>rs_multijob</title>
</head>
<body class="nui-hidden">
    <main id="app" class="app is-hidden" aria-hidden="true">
        <div class="backdrop" id="backdrop"></div>
        <section class="panel" role="dialog" aria-modal="true" aria-labelledby="menu-title">
            <header class="panel-header">
                <div class="brand-container">
                    <div class="brand-mark">
                        <i data-lucide="briefcase" class="brand-icon"></i>
                    </div>
                    <div class="heading">
                        <h1 id="menu-title">Správa Zaměstnání</h1>
                        <p id="menu-subtitle">Přepínej mezi svými dostupnými pracemi</p>
                    </div>
                </div>

                <button id="close-button" class="icon-button" type="button" aria-label="Zavřít">
                    <i data-lucide="x"></i>
                </button>
            </header>

            <div class="stats-bar">
                <div class="slot-info">
                    <span class="slot-label" id="slot-label">Obsazeno</span>
                    <span id="job-count" class="slot-counter">0/5</span>
                </div>
                <div class="progress-track">
                    <div id="slot-progress" class="progress-bar" style="width: 0%;"></div>
                </div>
            </div>

            <div class="search-box">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" id="search-input" placeholder="Hledat pozici nebo firmu..." autocomplete="off" spellcheck="false">
                <button type="button" id="clear-search" class="clear-search is-hidden" aria-label="Vymazat">
                    <i data-lucide="x-circle"></i>
                </button>
            </div>

            <div class="panel-body">
                <div id="jobs" class="jobs"></div>
                <div id="empty-state" class="empty-state is-hidden">
                    <div class="empty-icon">
                        <i data-lucide="folder-open"></i>
                    </div>
                    <h2 id="empty-title">Žádné uložené práce</h2>
                    <p id="empty-text">Zatím nemáš uložené žádné pracovní nabídky.</p>
                </div>
            </div>

            <footer class="panel-footer">
                <div class="footer-hint">
                    <span class="key-badge">ESC</span>
                    <span id="close-hint">Zavřít</span>
                </div>
            </footer>
        </section>

        <div id="confirm" class="confirm-layer is-hidden" aria-hidden="true">
            <section class="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
                <div class="confirm-symbol">
                    <i data-lucide="alert-triangle"></i>
                </div>
                <h2 id="confirm-title">Odebrat práci?</h2>
                <p id="confirm-text">Opravdu chceš odebrat tuto práci?</p>
                <div class="confirm-actions">
                    <button id="cancel-remove" class="button button-secondary" type="button">Zrušit</button>
                    <button id="confirm-remove" class="button button-danger" type="button">Odebrat job</button>
                </div>
            </section>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
